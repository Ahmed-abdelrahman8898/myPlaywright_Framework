name: Playwright Tests

on:
  push:
  pull_request:

  # Enable when you want nightly execution
  # schedule:
  #   - cron: "0 2 * * *"

  workflow_dispatch:
    inputs:
      test_environment:
        description: Choose environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - stage
          - test

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest

    env:
      CI: "true"
      TEST_ENV: ${{ inputs.test_environment || 'dev' }}
      HEADLESS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            reports/junit/
            reports/json/
          if-no-files-found: warn
          retention-days: 14
